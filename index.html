<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trolejbus Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">⚡</span>
          <div>
            <div class="tiny">MHD / Trolejbus</div>
            <div class="title">SIMULATOR KABINY</div>
          </div>
        </div>
        <div class="route-box">
          <div class="tiny">Linka</div>
          <div id="lineDisplay" class="route">23</div>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel main-panel">
          <div class="gauges">
            <div class="gauge">
              <div class="label">Rychlost</div>
              <div class="value" id="speedValue">0</div>
              <div class="unit">km/h</div>
            </div>
            <div class="gauge">
              <div class="label">Napětí</div>
              <div class="value" id="voltageValue">0</div>
              <div class="unit">V</div>
            </div>
            <div class="gauge">
              <div class="label">Proud</div>
              <div class="value" id="currentValue">0</div>
              <div class="unit">A</div>
            </div>
          </div>

          <div class="status-panel">
            <div class="status-item">
              <span>Směr</span>
              <strong id="directionStatus">VPŘED</strong>
            </div>
            <div class="status-item">
              <span>Stav</span>
              <strong id="vehicleState">STOJÍ</strong>
            </div>
            <div class="status-item">
              <span>Dveře</span>
              <strong id="doorStatus">ZAVŘENO</strong>
            </div>
            <div class="status-item">
              <span>Pantograf</span>
              <strong id="pantographStatus">SPUŠTĚN</strong>
            </div>
          </div>
        </section>

        <section class="panel controls-panel">
          <div class="controls-column left-column">
            <div class="toggle-block">
              <button class="toggle-button" data-action="pantograph">Pantograf</button>
              <button class="toggle-button" data-action="mainPower">Hlavní vypínač</button>
              <button class="toggle-button" data-action="emergency">Nouzový stav</button>
            </div>

            <div class="lever-block">
              <label for="accelerator">Plyn / výkon</label>
              <input id="accelerator" type="range" min="0" max="100" value="0" />
            </div>

            <div class="lever-block">
              <label for="brake">Brzda</label>
              <input id="brake" type="range" min="0" max="100" value="0" />
            </div>

            <div class="toggle-block compact">
              <button class="toggle-button" data-action="handbrake">Ruční brzda</button>
              <button class="toggle-button" data-action="door">Dveře</button>
              <button class="toggle-button" data-action="horn">Klakson</button>
            </div>
          </div>

          <div class="controls-column center-column">
            <div class="direction-panel">
              <button class="direction-btn active" data-direction="forward">VPŘED</button>
              <button class="direction-btn" data-direction="neutral">NEUTRÁL</button>
              <button class="direction-btn" data-direction="reverse">ZPĚT</button>
            </div>

            <div class="lights-box">
              <button class="toggle-button" data-action="headlights">Přední světla</button>
              <button class="toggle-button" data-action="warningLights">Výstražné</button>
              <button class="toggle-button" data-action="interiorLights">Kabina</button>
            </div>

            <div class="info-box">
              <div class="info-row">
                <span>Hlavní stav</span>
                <strong id="mainMode">NORMÁLNÍ</strong>
              </div>
              <div class="info-row">
                <span>Vedení</span>
                <strong id="contactStatus">OK</strong>
              </div>
              <div class="info-row">
                <span>Obsluha</span>
                <strong id="driverStatus">PŘIPRAVEN</strong>
              </div>
            </div>
          </div>

          <div class="controls-column right-column">
            <div class="display-panel">
              <div class="tiny label-text">Zastávka</div>
              <div class="station-display" id="stationDisplay">Náměstí</div>
            </div>

            <div class="button-stack">
              <button class="small-btn" data-action="nextStop">Další zast.</button>
              <button class="small-btn" data-action="toggleRoute">Změna linky</button>
              <button class="small-btn" data-action="doorMode">Dveře režim</button>
              <button class="small-btn" data-action="resetFault">Reset poruch</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
